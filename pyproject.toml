[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-games"
version = "0.1.0"
description = "Natural experiment: what empty COVID-era stadiums reveal about home advantage in football"
authors = [{ name = "Kaan Akar" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.scripts]
ghost-games-fetch-attendance = "ghost_games.attendance:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
fbref = ["soccerdata>=1.8"]
analysis = [
    "matplotlib>=3.7",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
